<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Underwater Cat Game</title>
    <style>
        body { 
            background: #0f2027; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: monospace; 
            color: #fff;
        }
        canvas { 
            border: 4px solid #005c97; 
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.4);
            background: #0077b6; 
        }
        .info { 
            margin-top: 10px; 
            font-weight: bold; 
            color: #90e0ef;
        }
    </style>
</head>
<body>

<canvas id="c" width="800" height="400"></canvas>
<div class="info">A = Left | D = Right | Space = Jump | S = Slam Down | R = Restart | 1 = Speed</div>

<script>
window.onload = function() {
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");

    // Audio Engine
    var audioCtx = null;
    function playSound(type) {
        if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        if (!audioCtx) return;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        var t = audioCtx.currentTime;

        if (type === "jump") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(450, t + 0.2);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
        } else if (type === "slam") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.linearRampToValueAtTime(70, t + 0.12);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.start(t); osc.stop(t + 0.12);
        } else if (type === "coin") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(987, t);
            osc.frequency.setValueAtTime(1318, t + 0.08);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
            osc.start(t); osc.stop(t + 0.25);
        } else if (type === "death") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(250, t);
            osc.frequency.linearRampToValueAtTime(50, t + 0.35);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
            osc.start(t); osc.stop(t + 0.35);
        } else if (type === "win") {
            [261, 329, 392, 523].forEach(function(f, i) {
                var o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = "triangle";
                o.frequency.setValueAtTime(f, t + i * 0.1);
                g.gain.setValueAtTime(0.1, t + i * 0.1);
                g.gain.linearRampToValueAtTime(0.01, t + i * 0.1 + 0.2);
                o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.2);
            });
        }
    }

    // State Variables
    var score = 0, state = "PLAYING";
    var keys = { a: false, d: false, s: false, space: false };

    var player = {
        x: 50, y: 300, w: 28, h: 20, vx: 0, vy: 0, speed: 2.5, jump: -9.5, grounded: false, facing: "right",
        reset: function() { this.x = 50; this.y = 300; this.vx = 0; this.vy = 0; this.grounded = false; this.facing = "right"; }
    };

    var platforms = [
        { x: 0, y: 360, w: 220, h: 40 },
        { x: 270, y: 310, w: 90, h: 20 },
        { x: 400, y: 250, w: 90, h: 20 },
        { x: 200, y: 190, w: 100, h: 20 },
        { x: 530, y: 360, w: 270, h: 40 }
    ];

    var hazards = [{ x: 120, y: 345, count: 4 }, { x: 600, y: 345, count: 5 }];
    var coins = [{ x: 80, y: 330, c: false }, { x: 310, y: 280, c: false }, { x: 240, y: 160, c: false }, { x: 440, y: 220, c: false }];
    var goal = { x: 740, y: 260, w: 10, h: 100 };

    var bubbles = [];
    for (var i = 0; i < 25; i++) {
        bubbles.push({
            x: Math.random() * 800,
            y: Math.random() * 400,
            r: Math.random() * 4 + 1,
            speed: Math.random() * 0.8 + 0.2
        });
    }

    window.addEventListener("keydown", function(e) {
        var k = e.key.toLowerCase();
        if (k === "a") keys.a = true;
        if (k === "d") keys.d = true;
        if (k === "s") keys.s = true;
        if (e.code === "Space" || k === " ") { keys.space = true; e.preventDefault(); }
        
        if ((state === "DEAD" || state === "WON") && (k === "r" || e.code === "Space" || k === " ")) {
            score = 0; state = "PLAYING"; player.reset();
            for (var i = 0; i < coins.length; i++) coins[i].c = false;
        }

        if (k === "1") {
            keys.a = keys.d = keys.space = keys.s = false;
            var val = prompt("Set Speed:", player.speed);
            if (val && !isNaN(val) && val > 0) player.speed = parseFloat(val);
        }
    });

    window.addEventListener("keyup", function(e) {
        var k = e.key.toLowerCase();
        if (k === "a") keys.a = false;
        if (k === "d") keys.d = false;
        if (k === "s") keys.s = false;
        if (e.code === "Space" || k === " ") keys.space = false;
    });

    function update() {
        for (var i = 0; i < bubbles.length; i++) {
            bubbles[i].y -= bubbles[i].speed;
            if (bubbles[i].y < -10) {
                bubbles[i].y = 410;
                bubbles[i].x = Math.random() * 800;
            }
        }

        if (keys.a) { player.vx = -player.speed; player.facing = "left"; }
        else if (keys.d) { player.vx = player.speed; player.facing = "right"; }
        else { player.vx = 0; }

        if (keys.space && player.grounded) {
            player.vy = player.jump;
            player.grounded = false;
            playSound("jump");
        }

        if (keys.s && !player.grounded) {
            player.vy = 11;
            playSound("slam");
        }

        player.vy += 0.4;
        player.x += player.vx;
        player.y += player.vy;

        player.grounded = false;
        for (var i = 0; i < platforms.length; i++) {
            var p = platforms[i];
            if (player.x < p.x + p.w && player.x + player.w > p.x &&
                player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + player.vy && player.vy >= 0) {
                player.grounded = true;
                player.vy = 0;
                player.y = p.y - player.h;
            }
        }

        if (player.x < 0) player.x = 0;
        if (player.y > canvas.height && state !== "DEAD") { state = "DEAD"; playSound("death"); }

        for (var i = 0; i < hazards.length; i++) {
            var h = hazards[i];
            if (player.x < h.x + (h.count * 15) && player.x + player.w > h.x &&
                player.y < h.y + 15 && player.y + player.h > h.y && state !== "DEAD") {
                state = "DEAD";
                playSound("death");
            }
        }

        for (var i = 0; i < coins.length; i++) {
            var c = coins[i];
            if (!c.c && player.x < c.x + 12 && player.x + player.w > c.x && player.y < c.y + 12 && player.y + player.h > c.y) {
                c.c = true;
                score += 10;
                playSound("coin");
            }
        }

        if (player.x < goal.x + goal.w && player.x + player.w > goal.x && player.y < goal.y + goal.h && player.y + player.h > goal.y && state !== "WON") {
            state = "WON";
            playSound("win");
        }
    }

    function render() {
        var bgGradient = ctx.createLinearGradient(0, 0, 0, 400);
        bgGradient.addColorStop(0, "#00b4d8");
        bgGradient.addColorStop(0.5, "#0077b6");
        bgGradient.addColorStop(1, "#03045e");
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        for (var i = 0; i < bubbles.length; i++) {
            ctx.beginPath();
            ctx.arc(bubbles[i].x, bubbles[i].y, bubbles[i].r, 0, Math.PI * 2);
            ctx.fill();
        }

        for (var i = 0; i < platforms.length; i++) {
            var p = platforms[i];
            ctx.fillStyle = "#6e473b";
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#38b000";
            ctx.fillRect(p.x, p.y, p.w, 6);
            ctx.fillStyle = "#70e000";
            for (var gx = p.x; gx < p.x + p.w; gx += 8) {
                ctx.fillRect(gx, p.y - 2, 3, 3);
            }
        }

        ctx.fillStyle = "#2b2d42";
        for (var i = 0; i < hazards.length; i++) {
            var h = hazards[i];
            for (var j = 0; j < h.count; j++) {
                var sx = h.x + j * 15;
                ctx.beginPath();
                ctx.moveTo(sx, h.y + 15); ctx.lineTo(sx + 7.5, h.y); ctx.lineTo(sx + 15, h.y + 15);
                ctx.fill();
            }
        }

        for (var i = 0; i < coins.length; i++) {
            if (!coins[i].c) {
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(coins[i].x + 5, coins[i].y + 5, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fb8500";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        ctx.fillStyle = "#e63946";
        ctx.fillRect(goal.x, goal.y, 4, goal.h);
        ctx.beginPath();
        ctx.moveTo(goal.x + 4, goal.y); ctx.lineTo(goal.x + 30, goal.y + 15); ctx.lineTo(goal.x + 4, goal.y + 30);
        ctx.fill();

        ctx.fillStyle = "#ff7b00";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        var dir = player.facing === "right" ? 1 : -1;
        var earX = dir === 1 ? player.x + player.w : player.x;
        ctx.beginPath();
        ctx.moveTo(earX - 2 * dir, player.y); ctx.lineTo(earX, player.y - 7); ctx.lineTo(earX - 8 * dir, player.y);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        var eyeX = dir === 1 ? player.x + player.w - 8 : player.x + 4;
        ctx.fillRect(eyeX, player.y + 4, 4, 4);

        ctx.fillStyle = "#caf0f8";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "left";
        ctx.fillText("SCORE: " + score, 20, 30);
        ctx.fillText("SPEED: " + player.speed, 670, 30);

        if (state !== "PLAYING") {
            ctx.fillStyle = "rgba(3, 4, 94, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#90e0ef";
            ctx.font = "bold 32px monospace";
            ctx.textAlign = "center";
            ctx.fillText(state === "DEAD" ? "GAME OVER" : "YOU WIN!", canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = "16px monospace";
            ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillText("Press 'R' or SPACE to Restart", canvas.width / 2, canvas.height / 2 + 45);
        }
    }

    function loop() {
        if (state === "PLAYING") update();
        render();
        requestAnimationFrame(loop);
    }
    loop();
};
</script>
</body>
</html>
